<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary SRS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .streak {
            background: #fff7ed;
            color: #c2410c;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid #ffedd5;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        button:active {
            background: var(--primary-hover);
        }

        .card-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .word-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .word-meta {
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .word-definition {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text);
            display: none;
        }

        .card-container.revealed .word-definition {
            display: block;
        }

        .reveal-prompt {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 12px;
        }

        .card-container.revealed .reveal-prompt {
            display: none;
        }

        .actions {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .card-container.revealed .actions {
            display: grid;
        }

        .btn-srs {
            padding: 10px 4px;
            font-size: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-again { background: #ef4444; }
        .btn-hard { background: #f97316; }
        .btn-good { background: #3b82f6; }
        .btn-easy { background: #10b981; }

        .stats {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vocabulary SRS</h1>
            <div class="streak" id="streakCounter">🔥 0 Days</div>
        </header>

        <div class="input-group">
            <input type="text" id="wordInput" placeholder="Add a new word..." autocomplete="off">
            <button id="addBtn">Add</button>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="card-content" id="cardContent">
                <div class="empty-state">All done for now! 🎉</div>
            </div>
            <div class="actions" id="srsActions">
                <button class="btn-srs btn-again" onclick="reviewCard(0)">Again</button>
                <button class="btn-srs btn-hard" onclick="reviewCard(1)">Hard</button>
                <button class="btn-srs btn-good" onclick="reviewCard(2)">Good</button>
                <button class="btn-srs btn-easy" onclick="reviewCard(3)">Easy</button>
            </div>
        </div>

        <div class="stats" id="statsDisplay">Total Cards: 0 | Due Today: 0</div>
    </div>

    <script>
        let cards = JSON.parse(localStorage.getItem('srs_cards')) || [];
        let currentCardIndex = null;

        const wordInput = document.getElementById('wordInput');
        const addBtn = document.getElementById('addBtn');
        const cardContainer = document.getElementById('cardContainer');
        const cardContent = document.getElementById('cardContent');
        const statsDisplay = document.getElementById('statsDisplay');

        addBtn.addEventListener('click', addNewWord);
        wordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewWord(); });
        cardContainer.addEventListener('click', (e) => {
            if (!cardContainer.classList.contains('revealed') && cards.length > 0 && currentCardIndex !== null) {
                cardContainer.classList.add('revealed');
            }
        });

        async function addNewWord() {
            const word = wordInput.value.trim().toLowerCase();
            if (!word) return;

            addBtn.textContent = 'Fetching...';
            addBtn.disabled = true;

            let definition = "No definition found.";
            let partOfSpeech = "";

            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                if (response.ok) {
                    const data = await response.json();
                    const entry = data[0];
                    partOfSpeech = entry.meanings[0]?.partOfSpeech || "";
                    definition = entry.meanings[0]?.definitions[0]?.definition || "Definition not available.";
                } else {
                    definition = prompt(`Could not auto-fetch definition for "${word}". Enter definition manually:`) || "Custom word";
                }
            } catch (err) {
                definition = prompt(`Network error fetching "${word}". Enter definition manually:`) || "Custom word";
            }

            cards.push({
                word: word,
                definition: definition,
                partOfSpeech: partOfSpeech,
                interval: 0,
                repetition: 0,
                dueDate: Date.now()
            });

            saveAndRender();
            wordInput.value = '';
            addBtn.textContent = 'Add';
            addBtn.disabled = false;
        }

        function saveAndRender() {
            localStorage.setItem('srs_cards', JSON.stringify(cards));
            renderNextCard();
        }

        function renderNextCard() {
            const now = Date.now();
            const dueCards = cards.filter(c => c.dueDate <= now);

            statsDisplay.textContent = `Total Cards: ${cards.length} | Due Today: ${dueCards.length}`;

            if (dueCards.length === 0) {
                currentCardIndex = null;
                cardContainer.classList.remove('revealed');
                cardContent.innerHTML = `<div class="empty-state">All done for now! 🎉</div>`;
                return;
            }

            // Find actual index of the first due card
            currentCardIndex = cards.indexOf(dueCards[0]);
            const card = cards[currentCardIndex];

            cardContainer.classList.remove('revealed');
            cardContent.innerHTML = `
                <h2 class="word-title">${card.word}</h2>
                <div class="word-meta">${card.partOfSpeech ? '(' + card.partOfSpeech + ')' : ''}</div>
                <div class="word-definition">${card.definition}</div>
                <div class="reveal-prompt">Tap card to reveal definition</div>
            `;
        }

        function reviewCard(rating) {
            if (currentCardIndex === null) return;
            let card = cards[currentCardIndex];

            // Simple SRS interval scaling based on button rating (0: Again, 1: Hard, 2: Good, 3: Easy)
            if (rating === 0) {
                card.interval = 1;
                card.dueDate = Date.now() + (1 * 60 * 1000); // 1 minute retry
            } else if (rating === 1) {
                card.interval = Math.max(1, card.interval * 1.2);
                card.dueDate = Date.now() + (card.interval * 24 * 60 * 60 * 1000);
            } else if (rating === 2) {
                card.interval = Math.max(1, card.interval * 2);
                card.dueDate = Date.now() + (card.interval * 24 * 60 * 60 * 1000);
            } else if (rating === 3) {
                card.interval = Math.max(1, card.interval * 3.5);
                card.dueDate = Date.now() + (card.interval * 24 * 60 * 60 * 1000);
            }

            saveAndRender();
        }

        renderNextCard();
    </script>
</body>
</html>
