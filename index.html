<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary SRS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-reset {
            background: #e2e8f0;
            color: #334155;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: #cbd5e1;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input, textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            background: var(--card-bg);
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .card-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .word-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            text-transform: capitalize;
        }

        .word-meta {
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .word-definition {
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text);
            display: none;
        }

        .card-container.revealed .word-definition {
            display: block;
        }

        .reveal-prompt {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 12px;
        }

        .card-container.revealed .reveal-prompt {
            display: none;
        }

        .actions {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .card-container.revealed .actions {
            display: grid;
        }

        .btn-srs {
            padding: 10px 4px;
            font-size: 0.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }

        .btn-again { background: #ef4444; }
        .btn-hard { background: #f97316; }
        .btn-good { background: #3b82f6; }
        .btn-easy { background: #10b981; }

        .stats {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .def-edit-box {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-save-def {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vocabulary SRS</h1>
            <div class="header-actions">
                <button class="btn-reset" onclick="resetSession()">🔄 Practice All</button>
            </div>
        </header>

        <div class="input-group">
            <input type="text" id="wordInput" placeholder="Add a new word..." autocomplete="off">
            <button class="btn-add" id="addBtn">Add</button>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="card-content" id="cardContent">
                <div class="empty-state">All done for now! 🎉</div>
            </div>
            <div class="actions" id="srsActions">
                <button class="btn-srs btn-again" onclick="reviewCard(0, event)">Again</button>
                <button class="btn-srs btn-hard" onclick="reviewCard(1, event)">Hard</button>
                <button class="btn-srs btn-good" onclick="reviewCard(2, event)">Good</button>
                <button class="btn-srs btn-easy" onclick="reviewCard(3, event)">Easy</button>
            </div>
        </div>

        <div class="stats" id="statsDisplay">Total Cards: 0 | Ready to Review: 0</div>
    </div>

    <script>
        let cards = JSON.parse(localStorage.getItem('srs_cards')) || [];
        let currentCardIndex = null;
        let practiceMode = false;

        const wordInput = document.getElementById('wordInput');
        const addBtn = document.getElementById('addBtn');
        const cardContainer = document.getElementById('cardContainer');
        const cardContent = document.getElementById('cardContent');
        const statsDisplay = document.getElementById('statsDisplay');

        addBtn.addEventListener('click', addNewWord);
        wordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addNewWord(); });

        cardContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
            if (!cardContainer.classList.contains('revealed') && currentCardIndex !== null) {
                cardContainer.classList.add('revealed');
            }
        });

        async function addNewWord() {
            const word = wordInput.value.trim().toLowerCase();
            if (!word) return;

            addBtn.textContent = '...';
            addBtn.disabled = true;

            let definition = "";
            let partOfSpeech = "";

            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                if (response.ok) {
                    const data = await response.json();
                    const entry = data[0];
                    partOfSpeech = entry.meanings[0]?.partOfSpeech || "";
                    definition = entry.meanings[0]?.definitions[0]?.definition || "";
                }
            } catch (err) {
                console.log("Auto-fetch error, switching to manual entry");
            }

            cards.push({
                word: word,
                definition: definition,
                partOfSpeech: partOfSpeech,
                interval: 0,
                dueDate: Date.now()
            });

            saveAndRender();
            wordInput.value = '';
            addBtn.textContent = 'Add';
            addBtn.disabled = false;
        }

        function saveAndRender() {
            localStorage.setItem('srs_cards', JSON.stringify(cards));
            renderNextCard();
        }

        function resetSession() {
            practiceMode = true;
            renderNextCard();
        }

        function renderNextCard() {
            const now = Date.now();
            let dueCards = practiceMode ? cards : cards.filter(c => c.dueDate <= now);

            statsDisplay.textContent = `Total Cards: ${cards.length} | Ready: ${dueCards.length} ${practiceMode ? '(Practice Mode)' : ''}`;

            if (dueCards.length === 0) {
                currentCardIndex = null;
                practiceMode = false;
                cardContainer.classList.remove('revealed');
                cardContent.innerHTML = `<div class="empty-state">All done for now! 🎉<br><br><small>Tap "Practice All" to review anytime.</small></div>`;
                return;
            }

            currentCardIndex = cards.indexOf(dueCards[0]);
            const card = cards[currentCardIndex];

            cardContainer.classList.remove('revealed');

            let defHtml = card.definition ? 
                `<div class="word-definition">${card.definition}</div>` : 
                `<div class="word-definition def-edit-box">
                    <textarea id="customDefInput" placeholder="Enter definition..." rows="3"></textarea>
                    <button class="btn-save-def" onclick="saveCustomDef(event)">Save Definition</button>
                 </div>`;

            cardContent.innerHTML = `
                <h2 class="word-title">${card.word}</h2>
                <div class="word-meta">${card.partOfSpeech ? '(' + card.partOfSpeech + ')' : ''}</div>
                ${defHtml}
                <div class="reveal-prompt">Tap card to reveal answer</div>
            `;
        }

        function saveCustomDef(e) {
            e.stopPropagation();
            const text = document.getElementById('customDefInput').value.trim();
            if (text && currentCardIndex !== null) {
                cards[currentCardIndex].definition = text;
                saveAndRender();
            }
        }

        function reviewCard(rating, e) {
            e.stopPropagation();
            if (currentCardIndex === null) return;
            let card = cards[currentCardIndex];

            if (rating === 0) {
                card.interval = 0;
                card.dueDate = Date.now() + (1 * 60 * 1000); // 1 min
            } else if (rating === 1) {
                card.interval = Math.max(1, card.interval * 1.2);
                card.dueDate = Date.now() + (card.interval * 12 * 60 * 60 * 1000);
            } else if (rating === 2) {
                card.interval = Math.max(1, card.interval * 2);
                card.dueDate = Date.now() + (card.interval * 24 * 60 * 60 * 1000);
            } else if (rating === 3) {
                card.interval = Math.max(1, card.interval * 3.5);
                card.dueDate = Date.now() + (card.interval * 3 * 24 * 60 * 60 * 1000);
            }

            saveAndRender();
        }

        renderNextCard();
    </script>
</body>
</html>
